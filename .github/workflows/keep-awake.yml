name: Keep database awake

# Supabase's free plan pauses a project after about a week with no activity.
# This pings the database every few days so the 1:1 Notebook stays available.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://xpdexxdnaokbkpluufjv.supabase.co/rest/v1/rpc/keep_awake" \
            -H "apikey: sb_publishable_-xfbJarwYgJlrUmzh__MCg_zP7nKLFa" \
            -H "Content-Type: application/json" -d '{}')
          echo "Supabase responded with HTTP $code"
          test "$code" = "200"
